name: Python Tests

on:
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies when available
        run: |
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
      - name: Run tests when available
        run: |
          if [ -d python/tests ] && find python/tests -name 'test_*.py' | grep -q .; then python -m pytest python/tests; else echo "No Python tests committed yet"; fi
