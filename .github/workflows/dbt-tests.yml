name: Local Warehouse and dbt Tests

on:
  pull_request:
    paths:
      - 'dbt/**'
      - 'python/**'
      - 'contracts/**'
      - 'data/reference/**'
      - 'Makefile'
      - '.github/workflows/dbt-tests.yml'
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'python/**'
      - 'contracts/**'
      - 'data/reference/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            dbt/requirements.txt
            python/requirements.txt
      - name: Install local warehouse dependencies
        run: make setup
      - name: Build deterministic local warehouse and all canonical marts
        run: make warehouse-smoke
      - name: Parse dbt project without warehouse credentials
        run: make dbt-parse
