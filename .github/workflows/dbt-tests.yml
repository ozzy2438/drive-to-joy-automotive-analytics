name: dbt Tests

on:
  pull_request:
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dbt/requirements.txt
      - name: Install dbt adapter
        run: python -m pip install -r dbt/requirements.txt
      - name: Load versioned seeds in local DuckDB
        run: >-
          dbt seed
          --project-dir dbt
          --profiles-dir dbt/ci
          --target local
      - name: Test local reference seeds
        run: >-
          dbt test
          --project-dir dbt
          --profiles-dir dbt/ci
          --target local
          --select
          vehicle_catalogue
          dealers
          campaign_registry
          experiment_registry
          personalisation_audience_registry
          reference_minimum_volumes
          reference_campaign_focus_integrity
          reference_proprietary_brand_guard
      - name: Parse dbt project without warehouse credentials
        run: >-
          dbt parse
          --project-dir dbt
          --profiles-dir dbt/ci
          --target ci
          --no-partial-parse
