version: 2

models:
  - name: fct_sessions
    description: Governed session mart.
    columns:
      - name: session_id
        tests: [unique, not_null]
  - name: fct_lead_funnel
    description: >
      One reconciled accepted web or CRM lead record, retaining unmatched
      records and match status.
    columns:
      - name: web_submission_id
        tests: [unique, not_null]
      - name: lead_id_hash
        tests: [not_null]
  - name: dim_vehicle
    columns:
      - name: variant_id
        tests: [unique, not_null]
  - name: dim_dealer
    columns:
      - name: dealer_id
        tests: [unique, not_null]
  - name: dim_campaign
    columns:
      - name: campaign_id
        tests: [unique, not_null]
  - name: dim_experiment
    columns:
      - name: experiment_id
        tests: [unique, not_null]
  - name: dim_personalisation_audience
    columns:
      - name: audience_id
        tests: [unique, not_null]
  - name: fct_data_quality_results
    description: One executable quality check result for the current run date.
    columns:
      - name: check_date
        tests: [not_null]
      - name: check_name
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['pass', 'fail']
      - name: failure_count
        tests: [not_null]
  - name: fct_vehicle_journey
    description: One session and vehicle-model journey progression record.
  - name: fct_media_performance
    description: One date and campaign media/performance record.
  - name: fct_experiment_results
    description: >
      One exposure date, experiment and variant result using assignment-key
      and bounded outcome joins.
  - name: fct_personalisation_performance
    description: >
      One exposure date, audience, experience and holdout result using bounded
      assignment-key joins.
  - name: fct_reconciliation_results
    description: >
      One Melbourne business date reconciliation result with additive matched,
      unmatched and identity-conflict components.
    columns:
      - name: business_date
        tests: [unique, not_null]
      - name: reconciliation_status
        tests:
          - accepted_values:
              arguments:
                values: ['pass', 'warn', 'fail', 'unknown', 'stale']
