[project]
name = "drive-to-joy-analytics"
version = "0.1.0"
description = "Synthetic automotive analytics, quality and experimentation utilities"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "statsmodels>=0.14,<1",
  "duckdb>=1.3,<2",
  "jsonschema>=4.23,<5",
  "pyarrow>=15,<26"
]

[project.scripts]
drive-to-joy-generate = "src.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
