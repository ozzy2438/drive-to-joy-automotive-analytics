manifest_version: 1.0.0
metric_contract_version: 1.0.0
fixture_adapter: dashboard_fixture
data_origin: synthetic
scenarios:
  - scenario_id: clean_baseline
    description: All governed metrics have valid additive inputs and current data.
  - scenario_id: unmatched_crm
    description: Accepted submissions include records not received by CRM.
  - scenario_id: identity_conflict
    description: Submission and CRM opaque lead references disagree.
  - scenario_id: zero_denominator
    description: A governed ratio has no eligible denominator.
  - scenario_id: stale_data
    description: Data-through time is older than the 48-hour freshness SLA.
  - scenario_id: invalid_utm
    description: Paid sessions include incomplete campaign parameters.
  - scenario_id: missing_parameter
    description: Context-required events omit a required vehicle parameter.
  - scenario_id: srm_failure
    description: Three-arm experiment allocation breaches the SRM threshold.
  - scenario_id: personalisation_holdout
    description: Treatment and generic holdout rates produce known absolute lift.
